name: leak-check

# Segunda red contra regresiones. El chequeo fuerte corre en el build local
# (--src, match por substring). Aca corre TODO, incluidas las reglas 3/3b, pero
# por HASH: tools/leakcheck_terms.hashed trae sha256 de los terminos privados,
# que no revelan los valores. Asi CI caza que alguien re-agregue un nombre
# privado sin tener la lista en claro en el repo.

on:
  push:
  pull_request:

jobs:
  leak-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # fetch-depth: 0 es imprescindible: con el default (1) el modo --deep
          # no tendria historia que revisar y pasaria en verde vacio, que es peor
          # que no correrlo.
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: leak-check (arbol + historia)
        run: python3 tools/leak_check.py --repo . --deep

      - name: prueba negativa (el check debe detectar un archivo sucio)
        run: python3 tools/leak_check.py --repo . --self-test
