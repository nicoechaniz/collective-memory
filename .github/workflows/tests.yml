name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: dependencias del contrato de intercambio
        run: python3 -m pip install -r requirements-exchange.txt

      # Invariante de seguridad: el servicio nunca queda expuesto a internet.
      - name: safe_bind
        run: python3 tests/test_safe_bind.py

      - name: sintaxis de los shell
        run: |
          for s in scripts/*.sh install.sh; do bash -n "$s"; done

      - name: compilacion de los modulos
        run: python3 -m compileall -q mapa tools

      - name: proyeccion y API de interfaz
        run: |
          python3 tests/test_ui_v2.py
          python3 tests/test_structural_mode.py

      - name: exportacion y publicacion revisada
        run: |
          python3 tests/test_exchange.py
          python3 tools/generate_exchange_vectors.py --check

      - name: frontend actual
        working-directory: web
        run: |
          npm ci
          npm audit --audit-level=moderate
          npm run build:all
          VITE_LAB_STRUCTURAL_ONLY=1 npm run build:lab
          VITE_UI_LOCALE=en VITE_LAB_STRUCTURAL_ONLY=1 npm run build:all

      # test_inyeccion_indirecta.py NO corre aca: necesita un runtime de modelo
      # local con GPU. Es un test de integracion manual (ver docs/operacion.md).
